name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v7

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DLUACPP_ENABLE_ASAN=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Run example
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./build/${{ matrix.build_type }}/luacpp_example.exe
          else
            ./build/luacpp_example
          fi
